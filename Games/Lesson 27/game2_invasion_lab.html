<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 27 Game 2</title>
</head>
<body>
<script src="../game_storage.js?v=3"></script>
<script src="../gt_kit.js?v=3"></script>
<script>
// L27 G2 - Invasion Lab: find the evolutionarily stable strategy of four population games.
const G=GT.init({lesson:'27',n:2,kind:'sim',title:'Invasion Lab',sub:'which strategy can mutants not invade?',
 how:'Four symmetric games with 3 strategies each (row player payoff shown). A strategy is an <b>ESS</b> if a population of it cannot be invaded by any small group of mutants: for each other strategy m, either u(s,s) &gt; u(m,s), or they are equal and u(s,m) &gt; u(m,m). Select <b>all</b> ESS strategies (or none), then the lab runs replicator dynamics from random starts to show where populations end up.'});
const GM=[{n:'Prisoner\'s dilemma with Tit-for-Tat',s:['AllC','AllD','TFT'],M:[[3,0,3],[5,1,3.2],[3,.8,3]]},{n:'Hawk-Dove (V=4, C=6)',s:['Hawk','Dove','Bully'],M:[[-1,4,.5],[0,2,0],[1,3.5,1]]},{n:'Coordination on a standard',s:['X','Y','Mix'],M:[[3,0,1.5],[0,2,1],[1.5,1,1.25]]},{n:'Rock-Paper-Scissors',s:['Rock','Paper','Scissors'],M:[[0,-1,1],[1,0,-1],[-1,1,0]]}];
function ess(M){const out=[];for(let s=0;s<3;s++){let ok=true;for(let m=0;m<3;m++){if(m===s)continue;if(M[s][s]>M[m][s]+1e-9)continue;if(Math.abs(M[s][s]-M[m][s])<1e-9&&M[s][m]>M[m][m]+1e-9)continue;ok=false}if(ok)out.push(s)}return out}
function rep(M){let x=[Math.random(),Math.random(),Math.random()];const sm=x.reduce((a,b)=>a+b);x=x.map(v=>v/sm);for(let t=0;t<6000;t++){const f=[0,1,2].map(i=>x.reduce((a,v,j)=>a+v*M[i][j],0));const av=x.reduce((a,v,i)=>a+v*f[i],0);x=x.map((v,i)=>Math.max(0,v+v*(f[i]-av)*.02));const s2=x.reduce((a,b)=>a+b);x=x.map(v=>v/s2)}return x}
let gi=0,total=0;const ui=GT.el('div',{class:'gt-card'});G.body.appendChild(ui);
function draw(){const q=GM[gi];ui.innerHTML='';ui.appendChild(GT.el('h3',{style:'color:#38bdf8',html:'Game '+(gi+1)+'/4: '+q.n}));ui.appendChild(GT.mtable(q.M.map((r,i)=>r.map((v,j)=>[v,q.M[j][i]])),q.s,q.s,[]));
 const sel=new Set();const row=GT.el('div',{class:'gt-row',style:'margin:10px 0'});q.s.forEach((n,i)=>{const b=GT.el('button',{class:'gt-btn',onclick:()=>{sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')}},[n+' is an ESS']);row.appendChild(b)});
 const go=GT.el('button',{class:'gt-btn gold'},['Test it']);go.onclick=()=>{const E=ess(q.M);const ok=E.length===sel.size&&E.every(i=>sel.has(i));const pts=ok?150:Math.max(0,60-30*Math.abs(E.length-sel.size));total+=pts;G.setScore(total);
  const ends=[rep(q.M),rep(q.M),rep(q.M)].map(x=>x.map((v,i)=>q.s[i]+' '+Math.round(v*100)+'%').join(', '));
  ui.innerHTML='';ui.appendChild(GT.el('p',{style:'line-height:1.7',html:'ESS set: <b>'+(E.length?E.map(i=>q.s[i]).join(', '):'none')+'</b> &mdash; '+(ok?'<b class="gt-ok">correct</b>':'<b class="gt-bad">not quite</b>')+'<br>Replicator runs ended at:<br>'+ends.join('<br>')+'<br>+'+pts}));
  const n=GT.el('button',{class:'gt-btn gold'},[gi<3?'Next game':'Finish']);n.onclick=()=>{gi++;if(gi>=4)G.end('An ESS is a convention that <b>resists invasion</b>. Some games have one (defect), several (coordination), a mixed one (hawk-dove) or none (rock-paper-scissors cycles). Norms persist when they are ESS.',total);else draw()};ui.appendChild(n)};ui.append(row,go)}
draw();

</script>
</body>
</html>
