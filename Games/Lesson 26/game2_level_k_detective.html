<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 26 Game 2</title>
</head>
<body>
<script src="../game_storage.js?v=3"></script>
<script src="../gt_kit.js?v=3"></script>
<script>
// L26 G2 - Level-k Detective: infer an opponent's depth of reasoning from history, then best-reply.
const G=GT.init({lesson:'26',n:2,kind:'sim',title:'Level-k Detective',sub:'classify the thinker, then outsmart them by exactly one step',
 how:'Six opponents each play a "pick a number, target = two-thirds of the average of you and the opponent" game. You see their last three picks against a changing environment. Decide their <b>level</b> (0 random, 1 best-replies to random, 2 best-replies to a Level-1, 3 deeper). Then enter your pick for this round; you win points by being closer to two-thirds of the opponent\'s expected pick.'});
const ui=GT.el('div',{class:'gt-card'});G.body.appendChild(ui);let r=0,total=0,lv,hist;
function pickFor(k){return k===0?GT.rnd(0,100):Math.max(0,50*Math.pow(2/3,k)*GT.rnd(.9,1.1)*(1.0))}
function nr(){lv=GT.ri(0,3);hist=[pickFor(lv),pickFor(lv),pickFor(lv)].map(x=>Math.round(x));draw()}
function draw(){ui.innerHTML='';ui.appendChild(GT.el('h3',{style:'color:#38bdf8',html:'Opponent '+(r+1)+'/6 &nbsp;<span class="gt-mu">total '+total+'</span>'}));
 ui.appendChild(GT.el('p',{html:'Last three picks: <b>'+hist.join(', ')+'</b>'}));ui.appendChild(GT.el('p',{class:'gt-mu',html:'Reference: Level-1 sits near 33, Level-2 near 22, Level-3 near 15, Level-0 is anywhere 0-100.'}));
 const row=GT.el('div',{class:'gt-row'});[0,1,2,3].forEach(k=>row.appendChild(GT.el('button',{class:'gt-btn',onclick:()=>cls(k)},['Level '+k])));ui.appendChild(row)}
function cls(k){const ok=k===lv;const base=ok?80:0;ui.innerHTML='';ui.appendChild(GT.el('p',{html:ok?'<b class="gt-ok">Correct, they are Level '+lv+'.</b>':'<b class="gt-bad">They were Level '+lv+'.</b>'}));
 const exp=k===0?50:50*Math.pow(2/3,k);ui.appendChild(GT.el('p',{class:'gt-mu',html:'Your classification implies they will pick about '+exp.toFixed(0)+'. Enter your pick (two-thirds of the average of the two of you).'}));
 const s=GT.el('input',{type:'range',class:'gt-r',min:0,max:100,step:1,value:30});const l=GT.el('span',{class:'gt-mu',html:' 30'});s.oninput=()=>l.textContent=' '+s.value;
 const b=GT.el('button',{class:'gt-btn gold'},['Lock pick']);b.onclick=()=>{const opp=pickFor(lv);const my=+s.value;const tgt=(opp+my)*2/3;const err=Math.abs(my-tgt);const pts=base+Math.max(0,Math.round(100-err*3));total+=pts;G.setScore(total);ui.innerHTML='';ui.appendChild(GT.el('p',{html:'Opponent picked '+opp.toFixed(0)+'; target '+tgt.toFixed(1)+'; you picked '+my+' &rarr; +'+pts}));
  const n=GT.el('button',{class:'gt-btn gold'},[r<5?'Next opponent':'Finish']);n.onclick=()=>{r++;if(r>=6)G.end('Level-k reasoning: respond to what people actually are, not to the perfect rational agent. Estimate their depth from behaviour and step <b>one level above</b> it.',total);else nr()};ui.appendChild(n)};ui.append(s,l,GT.el('br'),b)}
nr();

</script>
</body>
</html>
