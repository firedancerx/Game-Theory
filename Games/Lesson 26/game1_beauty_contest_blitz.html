<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 26 Game 1</title>
</head>
<body>
<script src="../game_storage.js?v=3"></script>
<script src="../gt_kit.js?v=3"></script>
<script>
// L26 G1 - Beauty Contest Blitz: guess 2/3 of the average against a crowd of Level-k thinkers.
const G=GT.init({lesson:'26',n:1,kind:'video',title:'Beauty Contest Blitz',sub:'guess two-thirds of the average of everyone',
 how:'Each round a crowd of 20 bots and you each pick a number 0-100. The winner is whoever is closest to <b>two-thirds of the average</b>. The crowd mixes <b>Level-0</b> (random), <b>Level-1</b> (best reply to random: about 33), <b>Level-2</b> (about 22) and <b>Level-3</b> (about 15). The mix changes each round and is shown. Drag the guess and lock it in within 10 seconds. Score is based on how close you land to the target.'});
const W=720,H=150;const cv=GT.el('canvas',{class:'gt-c'});G.body.appendChild(cv);const g=GT.fit(cv,W,H);
const sl=GT.el('input',{type:'range',class:'gt-r',min:0,max:100,step:1,value:50});const lab=GT.el('div',{class:'gt-mu',style:'text-align:center'});
const b=GT.el('button',{class:'gt-btn gold'},['Lock in']);G.body.append(lab,sl,GT.el('div',{class:'gt-row',style:'justify-content:center'},[b]));
const log=GT.el('div',{class:'gt-card gt-mu'});G.body.appendChild(log);
let r=0,mix,tl=10,last=performance.now(),locked=false,over=false,res=null;
function nr(){const a=[GT.ri(2,10),GT.ri(2,8),GT.ri(0,6),GT.ri(0,4)];const s=a.reduce((x,y)=>x+y);mix=a.map(x=>Math.round(x/s*20));mix[0]+=20-mix.reduce((x,y)=>x+y);tl=10;locked=false;res=null;b.disabled=false;sl.value=40;upd()}
function upd(){lab.innerHTML='Round '+(r+1)+'/8 &nbsp; crowd: L0 '+mix[0]+', L1 '+mix[1]+', L2 '+mix[2]+', L3 '+mix[3]+' &nbsp; your guess <b>'+sl.value+'</b>'}
sl.oninput=upd;
function lock(){if(locked||over)return;locked=true;b.disabled=true;const guesses=[];const mk=[()=>GT.rnd(0,100),()=>GT.rnd(28,38),()=>GT.rnd(18,26),()=>GT.rnd(10,18)];mix.forEach((n,k)=>{for(let i=0;i<n;i++)guesses.push(mk[k]())});const gu=+sl.value;const all=[...guesses,gu];const avg=all.reduce((x,y)=>x+y)/all.length;const tgt=avg*2/3;const err=Math.abs(gu-tgt);
 const better=guesses.filter(x=>Math.abs(x-tgt)<err).length;const pts=Math.max(0,Math.round(120-err*4));G.add(pts);res={avg,tgt,gu};
 log.innerHTML='Round '+(r+1)+': average '+avg.toFixed(1)+' &rarr; target <b>'+tgt.toFixed(1)+'</b>; you guessed '+gu+' ('+(better===0?'WINNER':better+' bots closer')+') +'+pts;
 setTimeout(()=>{r++;if(r>=8){over=true;G.end('People rarely play the fully rational 0. Most stop at 1-3 steps of reasoning, so the winning move is to <b>think one level beyond the crowd</b> - not infinitely deep.',G.score)}else nr()},2000)}
b.onclick=lock;
function f(now){const dt=(now-last)/1000;last=now;if(!over){if(!locked){tl-=dt;if(tl<=0)lock()}g.clearRect(0,0,W,H);g.fillStyle='#0b1220';g.fillRect(0,0,W,H);const X=v=>30+v/100*(W-60);g.strokeStyle='#334155';g.beginPath();g.moveTo(30,80);g.lineTo(W-30,80);g.stroke();g.fillStyle='#94a3b8';g.font='11px sans-serif';for(let v=0;v<=100;v+=20)g.fillText(v,X(v)-5,100);g.fillStyle='#38bdf8';g.fillRect(X(+sl.value)-3,50,6,60);if(res){g.fillStyle='#10b981';g.fillRect(X(res.tgt)-3,40,6,80);g.fillText('target',X(res.tgt)-12,34)}g.fillStyle='#f59e0b';g.fillRect(30,H-10,(W-60)*Math.max(0,tl)/10,6);requestAnimationFrame(f)}}
nr();requestAnimationFrame(f);

</script>
</body>
</html>
