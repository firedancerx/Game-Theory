<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 12 Game 2</title>
</head>
<body>
<script src="../game_storage.js?v=3"></script>
<script src="../gt_kit.js?v=3"></script>
<script>
// L12 G2 - Centipede Chamber: sequential take/pass against bots of different rationality.
const G=GT.init({lesson:'12',n:2,kind:'sim',title:'Centipede Chamber',sub:'the pot grows if you both pass - but who grabs first?',
 how:'A pot starts at 2. Players alternate: <b>Take</b> (grab the larger share and end the game) or <b>Pass</b> (the pot doubles, the other player decides). The textbook backward-induction answer is to Take immediately; five different opponents show when that is wise. Three games per opponent type; score is your cumulative winnings.'});
const OPP=[{n:'Textbook rational',p:()=>1},{n:'Trusting cooperator',p:s=>s>=5?.7:.1},{n:'Tit-for-tat Joe',p:(s,h)=>h.lastPass?0.12:.55},{n:'Gambler',p:s=>.25},{n:'Grim sceptic',p:s=>s<2?.6:.9}];
let oi=0,gi=0,total=0;const ui=GT.el('div',{class:'gt-card'});G.body.appendChild(ui);let st;
function init(){st={step:0,pot:2,h:{lastPass:false},turn:Math.random()<.5?0:1,done:false};draw()}
function share(){return {big:Math.round(st.pot*.8),small:st.pot-Math.round(st.pot*.8)}}
function draw(msg){const o=OPP[oi];ui.innerHTML='';ui.appendChild(GT.el('h3',{style:'color:#38bdf8',html:'Opponent '+(oi+1)+'/5: '+o.n+' &nbsp;<span class="gt-mu">game '+(gi+1)+'/3</span>'}));
 const bar=GT.el('div',{class:'gt-row',style:'margin:10px 0'});for(let i=0;i<6;i++)bar.appendChild(GT.el('div',{style:'flex:1;min-width:50px;padding:8px;text-align:center;border-radius:8px;border:2px solid '+(i===st.step?'#f59e0b':'#2a3a5a')+';background:'+(i<st.step?'#12351f':'#101830'),html:'Stage '+(i+1)+'<br><b>pot '+(2<<i)+'</b>'}));ui.appendChild(bar);
 ui.appendChild(GT.el('p',{class:'gt-mu',html:msg||''}));
 if(st.done)return;
 if(st.turn===0){const s=share();const r=GT.el('div',{class:'gt-row'});r.append(GT.el('button',{class:'gt-btn gold',onclick:()=>me('T')},['Take: you get '+s.big+', they get '+s.small]),GT.el('button',{class:'gt-btn pri',onclick:()=>me('P')},['Pass (pot doubles)']));ui.appendChild(r)}
 else{setTimeout(opp,500)}}
function end(my,th,txt){st.done=true;total+=my;G.setScore(total*10);const nx=GT.el('button',{class:'gt-btn gold',style:'margin-top:10px'},['Continue']);nx.onclick=()=>{gi++;if(gi>=3){gi=0;oi++}if(oi>=5)G.end('The theory says Take at once; people rarely do, and sometimes passing pays. The lesson is not "always defect" but: <b>the value of passing depends on your belief about the other mover\'s own backward reasoning</b>.',total*10);else init()};draw(txt);ui.appendChild(nx)}
function me(a){if(a==='T'){const s=share();end(s.big,s.small,'You took. You +'+s.big+', rival +'+s.small+'.');return}
 st.h.lastPass=false;nextStage()}
function nextStage(){st.step++;st.pot*=2;if(st.step>=6){const s=share();const meBig=st.turn===0;end(meBig?s.small:s.big,0,'The final pot was handed to the last mover: you got '+(meBig?s.small:s.big)+'.');return}st.turn=1-st.turn;draw()}
function opp(){const o=OPP[oi];if(Math.random()<o.p(st.step,st.h)){const s=share();end(s.small,s.big,'Rival took! You +'+s.small+', rival +'+s.big+'.')}else{st.h.lastPass=true;nextStage()}}
init();

</script>
</body>
</html>
