<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 19 Game 1</title>
</head>
<body>
<script src="../game_storage.js?v=3"></script>
<script src="../gt_kit.js?v=3"></script>
<script>
// L19 G1 - Menu Maker Rush: live pricing of three fare classes while customers self-select.
const G=GT.init({lesson:'19',n:1,kind:'video',title:'Menu Maker Rush',sub:'let customers sort themselves with a good menu',
 how:'Customers stream in, two hidden types: <b>Budget</b> (low value, price sensitive) and <b>Business</b> (high value, wants quality). Three products: <b>Basic</b>, <b>Plus</b>, <b>Premium</b> with costs 10, 25, 50. Drag the <b>price sliders live</b>. Each customer buys the option with the best surplus (value minus price), or nothing. Profit per sale = price minus cost. 45 seconds.'});
const W=720,H=240;const cv=GT.el('canvas',{class:'gt-c'});G.body.appendChild(cv);const g=GT.fit(cv,W,H);
const COST=[10,25,50],NAME=['Basic','Plus','Premium'];const V={bud:[40,50,55],bus:[50,90,140]};
const S=[];['Basic','Plus','Premium'].forEach((n,i)=>{const r=GT.el('input',{type:'range',class:'gt-r',min:0,max:160,step:1,value:[35,70,110][i]});const l=GT.el('span',{class:'gt-mu'});const upd=()=>{l.textContent=n+' price '+r.value+' (cost '+COST[i]+')'};r.oninput=upd;upd();S.push(r);G.body.appendChild(GT.el('div',{style:'margin:4px 0'},[l,GT.el('br'),r]))});
let cust=[],t=45,last=performance.now(),acc=0,tot=0,over=false,sales=[0,0,0],lost=0;
function spawn(){const bus=Math.random()<.4;const c={bus,x:-10,y:120+GT.rnd(-50,50),target:null,choice:-2};const v=bus?V.bus:V.bud;let b=-1,bs=0;for(let i=0;i<3;i++){const s=v[i]-(+S[i].value);if(s>bs){bs=s;b=i}}c.choice=b;cust.push(c);
 if(b>=0){const p=+S[b].value-COST[b];tot+=p;sales[b]++;G.setScore(Math.max(0,Math.round(tot)))}else lost++}
function f(now){const dt=(now-last)/1000;last=now;if(!over){t-=dt;acc+=dt;while(acc>.45){acc-=.45;spawn()}if(t<=0){over=true;G.end('Total profit '+Math.round(tot)+'. Sales: '+NAME.map((n,i)=>n+' '+sales[i]).join(', ')+'. A good menu makes each type <b>prefer its own item</b> (incentive compatibility): shave the premium margin enough that business buyers do not trade down, while keeping the budget fare above cost.',Math.max(0,Math.round(tot)));return}}
 g.clearRect(0,0,W,H);g.fillStyle='#0b1220';g.fillRect(0,0,W,H);for(let i=0;i<3;i++){g.fillStyle=['#38bdf8','#a78bfa','#f59e0b'][i];g.fillRect(W-110,30+i*60,90,44);g.fillStyle='#0b1220';g.font='700 13px sans-serif';g.fillText(NAME[i]+' '+S[i].value,W-102,58+i*60)}
 cust.forEach(c=>{c.x+=dt*(W-170)/2.2;if(c.choice>=0&&c.x>W-170){c.y+=((30+c.choice*60+22)-c.y)*Math.min(1,dt*4)}g.fillStyle=c.bus?'#f43f5e':'#10b981';if(c.choice===-1)g.globalAlpha=.4;g.beginPath();g.arc(c.x,c.y,7,0,7);g.fill();g.globalAlpha=1});
 cust=cust.filter(c=>c.x<W-100);g.fillStyle='#e2e8f0';g.font='13px sans-serif';g.fillText('green=budget  red=business   profit '+Math.round(tot)+'   no purchase '+lost+'   time '+Math.max(0,t|0)+'s',10,18);
 if(!over)requestAnimationFrame(f)}
requestAnimationFrame(f);

</script>
</body>
</html>
