<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 16 Game 1</title>
</head>
<body>
<script src="../game_storage.js"></script>
<script src="../gt_kit.js"></script>
<script>
// L16 G1 - Shadow of the Future: repeated PD where continuation probability varies.
const G=GT.init({lesson:'16',n:1,kind:'video',title:'Shadow of the Future',sub:'when the relationship may end any round',
 how:'Five relationships. After every round the relationship continues with probability <b>delta</b> (shown). Choose <b>Cooperate (C)</b> or <b>Defect (D)</b> within 2 seconds (or C is chosen). Payoffs: both C = 3, you D vs their C = 5, both D = 1, you C vs their D = 0. The partner plays <b>grim trigger</b>: one defection ends its cooperation. Higher delta rewards patience.'});
const W=720,H=120;const cv=GT.el('canvas',{class:'gt-c'});G.body.appendChild(cv);const g=GT.fit(cv,W,H);
const row=GT.el('div',{class:'gt-row',style:'justify-content:center'});const bc=GT.el('button',{class:'gt-btn pri',onclick:()=>play('C')},['Cooperate (C)']),bd=GT.el('button',{class:'gt-btn gold',onclick:()=>play('D')},['Defect (D)']);row.append(bc,bd);G.body.appendChild(row);
const log=GT.el('div',{class:'gt-card gt-mu',style:'max-height:160px;overflow:auto'});G.body.appendChild(log);
const DEL=[.2,.5,.75,.9,.95];let ri=0,round=0,grim=false,total=0,tl=2,last=performance.now(),over=false,rel=0;
function nr(){grim=false;round=0;rel=0;log.innerHTML='<b>Relationship '+(ri+1)+'/5, delta = '+DEL[ri]+'</b> (expected length '+(1/(1-DEL[ri])).toFixed(1)+' rounds)<br>';tl=2}
function play(m){if(over)return;const o=grim?'D':'C';if(m==='D')grim=true;
 const pay={CC:3,DC:5,DD:1,CD:0}[m+o];rel+=pay;total+=pay;G.setScore(total);round++;log.innerHTML+='R'+round+': you '+m+', they '+o+' &rarr; '+pay+'<br>';log.scrollTop=1e5;tl=2;
 if(Math.random()>DEL[ri]||round>=40){log.innerHTML+='<b>Relationship ended. Earned '+rel+'.</b><br>';ri++;if(ri>=5){over=true;G.end('Cooperation is sustainable when the future is heavy enough: with payoffs 3/5/1/0, grim trigger holds when <b>delta &ge; 0.5</b>. Below that, the one-shot temptation wins.',total)}else nr()}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='c')play('C');if(k==='d')play('D')});
function f(now){const dt=(now-last)/1000;last=now;if(!over){tl-=dt;if(tl<=0)play('C');g.clearRect(0,0,W,H);g.fillStyle='#0b1220';g.fillRect(0,0,W,H);g.fillStyle='#38bdf8';g.fillRect(20,30,(W-40)*DEL[Math.min(ri,4)],18);g.strokeStyle='#475569';g.strokeRect(20,30,W-40,18);g.fillStyle='#e2e8f0';g.font='13px sans-serif';g.fillText('continuation probability (shadow of the future): '+DEL[Math.min(ri,4)],20,22);g.fillStyle='#f59e0b';g.fillRect(20,80,(W-40)*Math.max(0,tl)/2,10);g.fillText('time to choose',20,108);requestAnimationFrame(f)}}
nr();requestAnimationFrame(f);

</script>
</body>
</html>
